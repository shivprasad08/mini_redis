syntax = "proto3";

package miniredis.election;

service ElectionService {
	rpc Election (ElectionMessage) returns (ElectionAck);
	rpc Coordinator (CoordinatorMessage) returns (CoordinatorAck);
	rpc RingElection (RingElectionMessage) returns (RingElectionAck);
	rpc RingCoordinator (RingCoordinatorMessage) returns (RingCoordinatorAck);
}

message ElectionMessage {
	string sender_id = 1;
	int64 sender_priority = 2;
	uint64 lamport_timestamp = 3;
}

message ElectionAck {
	bool acknowledged = 1;
	uint64 lamport_timestamp = 2;
}

message CoordinatorMessage {
	string new_primary_id = 1;
	string new_primary_address = 2;
	uint64 election_epoch = 3;
	uint64 lamport_timestamp = 4;
}

message CoordinatorAck {
	bool acknowledged = 1;
	uint64 lamport_timestamp = 2;
}

// M18: Chang-Roberts Ring Election messages

message RingElectionMessage {
	string sender_id = 1;
	string election_id = 2;
	string candidate_id = 3;
	uint64 election_epoch = 4;
	uint64 lamport_timestamp = 5;
	repeated string visited_nodes = 6;
}

message RingElectionAck {
	bool acknowledged = 1;
	uint64 lamport_timestamp = 2;
}

message RingCoordinatorMessage {
	string sender_id = 1;
	string new_primary_id = 2;
	string new_primary_address = 3;
	uint64 election_epoch = 4;
	uint64 lamport_timestamp = 5;
	repeated string visited_nodes = 6;
}

message RingCoordinatorAck {
	bool acknowledged = 1;
	uint64 lamport_timestamp = 2;
}
