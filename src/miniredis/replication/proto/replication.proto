syntax = "proto3";
package miniredis.replication;

service ReplicationService {
  rpc ReplicateWrite (WriteOp) returns (Ack);
  rpc GetProgress (ProgressRequest) returns (ProgressResponse);
  rpc SyncSnapshot (SyncSnapshotRequest) returns (SyncSnapshotResponse);
  // M17 Chandy-Lamport global snapshot
  rpc SnapshotMarker (SnapshotMarkerRequest) returns (SnapshotMarkerAck);
  rpc CollectSnapshot (CollectSnapshotRequest) returns (CollectSnapshotResponse);
  rpc ReleaseSnapshot (ReleaseSnapshotRequest) returns (ReleaseSnapshotAck);
}

message WriteOp {
  string op_type = 1;      // "SET", "DEL", "EXPIRE"
  string key = 2;
  bytes value = 3;         // empty for DEL
  int64 ttl_seconds = 4;   // 0 if no TTL
  int64 sequence = 5;      // monotonically increasing within an epoch
  uint64 epoch = 6;        // monotonically increasing leadership epoch
  uint64 lamport_timestamp = 7;
  int64 expiry_deadline_ms = 8; // 0 if no TTL; corrected-clock absolute deadline
  string fencing_token = 9;      // M16: optional fencing token for protected writes
  // M17 FIFO link stamp (0/empty when sent outside a link)
  string sender_id = 10;
  uint64 link_seq = 11;
  string link_incarnation = 12;
}

message Ack {
  bool success = 1;
  int64 applied_sequence = 2;
  uint64 epoch = 3;
  uint64 lamport_timestamp = 4;
}

// M15: Progress query messages

message ProgressRequest {
  string requester_node_id = 1;
  uint64 lamport_timestamp = 2;
}

message ProgressResponse {
  string node_id = 1;
  string role = 2;
  uint64 epoch = 3;
  int64 last_applied_sequence = 4;
  string history_digest = 5;
  bool gap_detected = 6;
  int64 gap_expected_sequence = 7;
  int64 gap_observed_sequence = 8;
  uint64 lamport_timestamp = 9;
  string primary_node_id = 10;
}

// Safe state recovery and catch-up snapshot messages

message SyncSnapshotRequest {
  string requester_node_id = 1;
  uint64 lamport_timestamp = 2;
}

message SnapshotItem {
  string key = 1;
  bytes value = 2;
  int64 expiry_deadline_ms = 3;
}

message SyncSnapshotResponse {
  string node_id = 1;
  uint64 epoch = 2;
  int64 sequence = 3;
  string history_digest = 4;
  repeated SnapshotItem items = 5;
  uint64 lamport_timestamp = 6;
  string role = 7;                            // serving node's role; only a primary snapshot is authoritative
  map<string, string> fencing_watermarks = 8; // M16 fencing high-water marks, key -> token
  string ledger_head = 9;                     // M20 chain head at the snapshot point ("" if not persisted)
}

// M17 Chandy-Lamport snapshot messages. Markers travel on the same FIFO link as
// ReplicateWrite and carry the same link stamp.

message SnapshotMarkerRequest {
  string snapshot_id = 1;
  string initiator_id = 2;
  string sender_id = 3;
  uint64 link_seq = 4;
  string link_incarnation = 5;
  uint64 lamport_timestamp = 6;
}

message SnapshotMarkerAck {
  string status = 1;   // recorded | closed | duplicate | stale | busy | invalid_id | unknown_sender | out_of_order | unsupported
  uint64 lamport_timestamp = 2;
}

message CollectSnapshotRequest {
  string snapshot_id = 1;
  int64 wait_ms = 2;
  string requester_id = 3;
  uint64 lamport_timestamp = 4;
}

message CollectSnapshotResponse {
  string snapshot_id = 1;
  string node_id = 2;
  string status = 3;
  string report_json = 4;   // recorded state + incoming channel states (JSON)
  uint64 lamport_timestamp = 5;
}

message ReleaseSnapshotRequest {
  string snapshot_id = 1;
  string requester_id = 2;
}

message ReleaseSnapshotAck {
  bool released = 1;
}
