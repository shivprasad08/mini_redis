[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-redis"
version = "0.1.0"
description = "A distributed key-value store"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.59.0",
    "grpcio-tools>=1.59.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session; see tests/conftest.py for why.
asyncio_default_fixture_loop_scope = "session"

[project.scripts]
miniredis-server = "miniredis.server:main"
miniredis-cli = "miniredis.cli_client:main"
miniredis-benchmark = "miniredis.benchmark:main"
miniredis-timeline = "miniredis.timeline:main"
