# docker-compose.yml
#
# Multi-node mini-redis cluster topology (3 Nodes):
# - Node A (node-a): bootstrap primary of a brand-new cluster
# - Node B (node-b): Replica
# - Node C (node-c): Replica
#
# --role is only a bootstrap hint. On every start a node first asks its peers
# (GetProgress) for an established leadership epoch: if one exists it follows
# the confirmed leader and pulls its snapshot, whatever --role says. Only when
# no peer reports leadership and a majority is reachable does node-a initialize
# the cluster. So `docker compose stop node-a` / `start node-a` after a failover
# rejoins node-a as a replica of the current leader instead of a second primary.
#
# M20: each node writes its hash-chained ledger to its own named volume
# (node-a-data, node-b-data, node-c-data) mounted at /data, and replays it on
# start. Volumes are never shared between nodes.
#
# Inter-node communication uses Docker container hostnames on the shared
# 'miniredis-net' bridge network.
#
# Host-accessible client TCP ports:
# - node-a: ${NODE_A_PORT:-6380} -> 6380
# - node-b: ${NODE_B_PORT:-6381} -> 6380
# - node-c: ${NODE_C_PORT:-6382} -> 6380

services:
  node-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miniredis-node-a
    hostname: node-a
    command: >
      --role primary
      --node-id node-a
      --host 0.0.0.0
      --port 6380
      --grpc-port 6381
      --replica-of node-b:6381
      --replica-of node-c:6381
      --peer node-b,node-b:6381,node-b:6380
      --peer node-c,node-c:6381,node-c:6380
      --write-mode ${WRITE_MODE:-async}
      --mutex-algo ${MUTEX_ALGO:-ricart-agrawala}
      --election-algo ${ELECTION_ALGO:-bully}
      --simulate-latency-ms ${SIMULATE_LATENCY_MS:-0.0}
      --clock-skew-ms ${CLOCK_SKEW_MS:-0.0}
      --data-dir /data
      --fsync ${FSYNC_POLICY:-always}
    volumes:
      - node-a-data:/data
    ports:
      - "${NODE_A_PORT:-6380}:6380"
    networks:
      - miniredis-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.create_connection((\"127.0.0.1\", 6380), timeout=2); s.sendall(b\"*1\\r\\n$$4\\r\\nPING\\r\\n\"); resp = s.recv(1024); assert b\"+PONG\" in resp; s.close()'"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    restart: on-failure

  node-b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miniredis-node-b
    hostname: node-b
    command: >
      --role replica
      --node-id node-b
      --host 0.0.0.0
      --port 6380
      --grpc-port 6381
      --primary-address node-a:6381
      --primary-node-id node-a
      --peer node-a,node-a:6381,node-a:6380
      --peer node-c,node-c:6381,node-c:6380
      --write-mode ${WRITE_MODE:-async}
      --mutex-algo ${MUTEX_ALGO:-ricart-agrawala}
      --election-algo ${ELECTION_ALGO:-bully}
      --simulate-latency-ms ${SIMULATE_LATENCY_MS:-0.0}
      --clock-skew-ms ${CLOCK_SKEW_MS:-0.0}
      --data-dir /data
      --fsync ${FSYNC_POLICY:-always}
    volumes:
      - node-b-data:/data
    ports:
      - "${NODE_B_PORT:-6381}:6380"
    networks:
      - miniredis-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.create_connection((\"127.0.0.1\", 6380), timeout=2); s.sendall(b\"*1\\r\\n$$4\\r\\nPING\\r\\n\"); resp = s.recv(1024); assert b\"+PONG\" in resp; s.close()'"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    restart: on-failure

  node-c:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miniredis-node-c
    hostname: node-c
    command: >
      --role replica
      --node-id node-c
      --host 0.0.0.0
      --port 6380
      --grpc-port 6381
      --primary-address node-a:6381
      --primary-node-id node-a
      --peer node-a,node-a:6381,node-a:6380
      --peer node-b,node-b:6381,node-b:6380
      --write-mode ${WRITE_MODE:-async}
      --mutex-algo ${MUTEX_ALGO:-ricart-agrawala}
      --election-algo ${ELECTION_ALGO:-bully}
      --simulate-latency-ms ${SIMULATE_LATENCY_MS:-0.0}
      --clock-skew-ms ${CLOCK_SKEW_MS:-0.0}
      --data-dir /data
      --fsync ${FSYNC_POLICY:-always}
    volumes:
      - node-c-data:/data
    ports:
      - "${NODE_C_PORT:-6382}:6380"
    networks:
      - miniredis-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.create_connection((\"127.0.0.1\", 6380), timeout=2); s.sendall(b\"*1\\r\\n$$4\\r\\nPING\\r\\n\"); resp = s.recv(1024); assert b\"+PONG\" in resp; s.close()'"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    restart: on-failure

  # M25: HTTP gateway + dashboard (smart client to the three nodes).
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miniredis-gateway
    entrypoint: ["python", "-m", "miniredis.gateway"]
    command: >
      --nodes node-a:6380,node-b:6380,node-c:6380
      --host 0.0.0.0
      --port 8080
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - miniredis-net
    depends_on:
      - node-a
      - node-b
      - node-c
    restart: on-failure

networks:
  miniredis-net:
    driver: bridge

# M20: one named volume per node, so each node's ledger survives container
# recreation (`docker compose down` keeps them; `down -v` deletes them).
volumes:
  node-a-data:
  node-b-data:
  node-c-data:
